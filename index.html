<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Race naar het Leven</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Race naar het Leven</h1>
      <div id="hud">
        <span id="levelLabel"></span>
        <span id="hearts"></span>
        <span id="progress"></span>
      </div>
    </header>

    <div id="gameWrap">
      <canvas id="gameCanvas" width="540" height="450"></canvas>
      <canvas id="confettiCanvas" width="540" height="450"></canvas>

      <div id="wordPanel" class="hidden">
        <div class="word-label">Typ dit woord over:</div>
        <div id="wordTarget"></div>
        <div class="timer-track"><div id="wordTimer"></div></div>
        <div class="word-row">
          <input id="wordInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
          <button id="wordSubmit">OK</button>
        </div>
        <div id="wordFeedback"></div>
      </div>

      <div id="homeScreen" class="overlay hidden">
        <h2>Race naar het Leven</h2>
        <p>Van zaadcel tot kind: elke keuze heeft gevolgen. Je hebt <strong>3 hartjes</strong> per hoofdstuk.</p>
        <div class="menu">
          <button id="chapter1Btn">Hoofdstuk 1: Van zaadcel tot baby</button>
          <button id="chapter2Btn">Hoofdstuk 2: Opgroeien (0–11 jaar)</button>
          <button id="appearanceBtn" class="secondary">Uiterlijk aanpassen</button>
        </div>
      </div>

      <div id="creatorScreen" class="overlay hidden">
        <h2>Hoe zie jij eruit?</h2>
        <div class="creator">
          <canvas id="previewCanvas" width="120" height="170"></canvas>
          <div id="creatorOptions"></div>
        </div>
        <button id="creatorDoneBtn">Klaar</button>
      </div>

      <div id="introScreen" class="overlay hidden">
        <div id="introDone" class="done hidden"></div>
        <h2 id="introTitle"></h2>
        <p id="introText"></p>
        <button id="introBtn">Start level</button>
        <button id="introMenuBtn" class="link">Hoofdmenu</button>
      </div>

      <div id="failScreen" class="overlay hidden">
        <h2>Au! 💔</h2>
        <p id="failReason"></p>
        <p id="failHearts"></p>
        <button id="retryBtn">Probeer opnieuw</button>
        <button id="failMenuBtn" class="link">Hoofdmenu</button>
      </div>

      <div id="gameOverScreen" class="overlay hidden">
        <h2 id="gameOverTitle">Game Over 💥</h2>
        <p id="gameOverReason"></p>
        <p id="gameOverNote"></p>
        <button id="restartBtn">Opnieuw beginnen</button>
        <button id="gameOverMenuBtn" class="link">Hoofdmenu</button>
      </div>

      <div id="winScreen" class="overlay hidden">
        <h2 id="winTitle"></h2>
        <div id="babyStage">
          <div id="baby"></div>
        </div>
        <p id="winText"></p>
        <button id="nextChapterBtn">Door naar hoofdstuk 2</button>
        <button id="winMenuBtn" class="link">Hoofdmenu</button>
      </div>
    </div>

    <div id="touchControls">
      <button data-dir="up">▲</button>
      <div class="mid-row">
        <button data-dir="left">◀</button>
        <button data-dir="down">▼</button>
        <button data-dir="right">▶</button>
      </div>
      <button id="actionBtn">SPATIE</button>
    </div>
  </div>

  <script src="src/shared.js"></script>
  <script src="src/character.js"></script>
  <script src="src/snake.js"></script>
  <script src="src/fight.js"></script>
  <script src="src/womb.js"></script>
  <script src="src/ch1/level1-vagina.js"></script>
  <script src="src/ch1/level2-cervix.js"></script>
  <script src="src/ch1/level3-uterus.js"></script>
  <script src="src/ch1/level4-words.js"></script>
  <script src="src/ch1/level5-tube.js"></script>
  <script src="src/ch1/level6-rivals.js"></script>
  <script src="src/ch1/level7-egg.js"></script>
  <script src="src/ch1/level8-twin.js"></script>
  <script src="src/ch1/level9-fight.js"></script>
  <script src="src/ch2/scenery.js"></script>
  <script src="src/ch2/level1-arena.js"></script>
  <script src="src/ch2/level2-dinner.js"></script>
  <script src="src/ch2/level3-walk.js"></script>
  <script src="src/ch2/level4-school.js"></script>
  <script src="src/ch2/level5-football.js"></script>
  <script src="src/ch2/level6-basketball.js"></script>
  <script src="src/ch2/level7-chair.js"></script>
  <script src="src/ch2/level8-provoke.js"></script>
  <script src="src/ch2/level9-therapy.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
