<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Race naar het Leven 🐣</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Race naar het Leven</h1>
      <div id="hud">
        <div class="stat">
          <span class="label">Eicellen</span>
          <span id="score">0</span> / <span id="target">15</span>
        </div>
      </div>
    </header>

    <div id="gameWrap">
      <canvas id="gameCanvas" width="540" height="450"></canvas>
      <canvas id="confettiCanvas" width="540" height="450"></canvas>

      <div id="startScreen" class="overlay">
        <h2>Zaadcel op Missie 🏊</h2>
        <p>Bestuur de zaadcel met de <strong>pijltjestoetsen</strong> of <strong>WASD</strong>.</p>
        <p>Vang <strong>15 eicellen</strong> om een baby te maken! Ga je rand uit? Dan zwem je gewoon aan de andere kant weer verder.</p>
        <button id="startBtn">Start het Avontuur</button>
      </div>

      <div id="winScreen" class="overlay hidden">
        <h2>Gefeliciteerd! 🎉</h2>
        <div id="babyStage">
          <div id="baby">👶</div>
        </div>
        <p>Het is een nieuw leven! Je hebt alle 15 eicellen bevrucht.</p>
        <button id="playAgainBtn">Nog een Keer</button>
      </div>
    </div>

    <div id="touchControls">
      <button data-dir="up">▲</button>
      <div class="mid-row">
        <button data-dir="left">◀</button>
        <button data-dir="down">▼</button>
        <button data-dir="right">▶</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
